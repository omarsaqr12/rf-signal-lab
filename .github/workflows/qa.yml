name: RF Signal Lab QA

on:
  pull_request:
    paths:
      - '.github/workflows/qa.yml'
      - 'README.md'
      - 'qa/**'
      - 'rflab/**'
      - 'run.sh'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  numerical-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install numerical dependencies
        run: python -m pip install numpy scipy
      - name: Verify analytic physics checks
        run: python qa/verify_physics.py
      - name: Verify report comparisons and enabled narration
        run: python qa/report.py
      - name: Smoke-test all modulation/impairment configurations
        run: python qa/sweep.py
      - name: Upload generated verification report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-verification
          path: qa/VERIFICATION.md
          if-no-files-found: warn

  browser-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install simulator and browser dependencies
        run: |
          python -m pip install numpy scipy playwright
          python -m playwright install --with-deps chromium
      - name: Capture representative cases in a real browser
        run: |
          set -euo pipefail
          python -m rflab.server 8765 > /tmp/rf-lab-server.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8765/api/meta > /dev/null; then break; fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:8765/api/meta > /dev/null
          python qa/shoot.py /tmp/rf-lab-shots
      - name: Upload browser screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-browser-shots
          path: /tmp/rf-lab-shots/
          if-no-files-found: warn
